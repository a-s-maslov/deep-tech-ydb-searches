[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-tech-ydb-searches"
version = "0.1.0"
description = "Prepared MIRACL RU data for YDB full-text, vector and hybrid-search workshops"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "huggingface-hub>=0.27,<2",
  "numpy>=1.26,<3",
  "pyarrow>=17,<22",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
model = ["torch>=2.4,<3", "transformers>=4.46,<6"]
quality = ["faiss-cpu>=1.9,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
deep-tech-data = "deep_tech_ydb_searches.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
